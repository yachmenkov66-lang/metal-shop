services:
  db:
    image: postgres:16-alpine
    container_name: metalshop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metal
      POSTGRES_PASSWORD: metal
      POSTGRES_DB: metalshop
    ports:
      - "5433:5432" # хост:контейнер — 5433 чтобы не конфликтовать с локальным PG
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metal -d metalshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
